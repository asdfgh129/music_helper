# Music Helper 本地配置示例
#
# 用法：复制为 config.ini 后修改。config.ini 已被 .gitignore 忽略。
# 优先级：环境变量 > config.ini > config.py 默认值。
# 相对路径按项目根目录解析；也可以写 D:\music 这样的绝对路径。

[paths]
# 最终音乐库
library_dir = D:\music
# 流水线工作区（解密、去重、打标签都在这里；完整文件处理完仍留在这里）
workspace_dir = G:\Temp
# 以下两项留空即用默认值（G:\Unready / G:\Tmp），
# 建议与 workspace_dir 平级，避免被声纹工具当成临时文件重复扫描
incomplete_dir =
duplicate_dir =
# 下载目录
netease_dir = G:\Neteasymusic
qq_dir = G:\QQMusic
# 解密暂存区默认在 workspace_dir/_decrypt
decrypt_dir =
# 声纹库；相对路径按项目根解析
db_path = music.db

[tools]
# 留空则使用仓库内 tools/ 下的默认位置（按平台自动挑 soundalike.exe / -darwin-arm64、
# um.exe / um-darwin-arm64、fpcalc）
um_exe =
soundalike_exe =
fpcalc_exe =
qq_hook =
# ---- QQ 音乐客户端（解密前置条件）----
# qq_client_exe 留空即自动探测：Windows 读注册表 HKLM\SOFTWARE\WOW6432Node\Tencent\QQMusic
# 的 Install 值，再按常见安装路径兜底；macOS 查 /Applications/QQMusic.app。
# 检测不到客户端时会用下面两个安装包自动装旧版，再打屏蔽更新补丁——客户端升级会让
# Frida 依赖的 MSVC 修饰导出名变化，脚本随即失效，所以补丁和解密能力是绑在一起的。
qq_client_exe =
qq_installer =
qq_update_patch =
qq_mac_dmg =
qq_mac_patch =
# 未登录时等待用户扫码登录的秒数；0 表示不等待，未登录也照常尝试（会全部失败）
qq_login_timeout = 300
# QQ 音乐新版 qmc（mflac/mgg）离线解密凭据：两个必须同时给，只给 mmkv 会让 um 打开
# vault 失败（连旧版 qmc 也一起解不开）。
# qmc_mmkv 留空时，macOS 上会自动找客户端 mmkv 里的 MMKVStreamEncryptId（存歌曲 ekey）；
# Windows 版客户端不产生该文件，自动发现按平台关闭——那边请走 Frida（qq_hook），
# 或用 19.51 及以下版本 QQ 音乐下载（该区间无需密钥）。
# qmc_mmkv_key 是 mmkv 库自身的 16 位 ASCII 密码（macOS 2023.09.03 之后的客户端会加密），
# 官方未公开提取方法，只能自行逆向取得；留空即"库未加密"。
qmc_mmkv =
qmc_mmkv_key =

[settings]
# 外部程序超时（秒）
subprocess_timeout = 3600
# 与 soundalike / fpcalc 保持一致的指纹时长（秒）
fpcalc_length = 120
# 声纹匹配分数阈值（0-100）
fingerprint_threshold = 50
# 判定重复时允许的时长误差（秒）
duration_tolerance = 3.0
# 封面下载上限（字节）
max_cover_size = 5242880
# 解密成功后加密原文件去向：return / trash / keep
encrypted_source_mode = return
