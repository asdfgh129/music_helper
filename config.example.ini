# Music Helper 本地配置示例
#
# 用法：复制为 config.ini 后修改。config.ini 已被 .gitignore 忽略。
# 优先级：环境变量 > config.ini > config.py 默认值。
# 相对路径按项目根目录解析；也可以写 D:\music 这样的绝对路径。

[paths]
# 最终音乐库
library_dir = D:\music
# 流水线工作区（解密、去重、打标签都在这里；完整文件处理完仍留在这里）
workspace_dir = G:\Temp
# 以下两项留空即用默认值（G:\Unready / G:\Tmp），
# 建议与 workspace_dir 平级，避免被声纹工具当成临时文件重复扫描
incomplete_dir =
duplicate_dir =
# 下载目录
netease_dir = G:\Neteasymusic
qq_dir = G:\QQMusic
# 解密暂存区默认在 workspace_dir/_decrypt
decrypt_dir =
# 声纹库；相对路径按项目根解析
db_path = music.db

[tools]
# 留空则使用仓库内 tools/ 下的默认位置
um_exe =
soundalike_exe =
qq_hook =

[settings]
# 外部程序超时（秒）
subprocess_timeout = 3600
# 与 soundalike / fpcalc 保持一致的指纹时长（秒）
fpcalc_length = 120
# 声纹匹配分数阈值（0-100）
fingerprint_threshold = 50
# 判定重复时允许的时长误差（秒）
duration_tolerance = 3.0
# 封面下载上限（字节）
max_cover_size = 5242880
# 解密成功后加密原文件去向：return / trash / keep
encrypted_source_mode = return
